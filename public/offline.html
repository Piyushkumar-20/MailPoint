<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11161d">
  <title>MailPoint — Offline</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11161d; color: #f5f7fa; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 28rem; padding: 2rem; text-align: center; }
    h1 { margin-bottom: .5rem; }
    p { color: #aeb8c5; }
    button { border: 0; border-radius: .65rem; padding: .75rem 1rem; background: #f5f7fa; color: #11161d; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>MailPoint needs an internet connection to load your inbox, calendar, and AI assistant. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
